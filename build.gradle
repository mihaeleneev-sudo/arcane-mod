# Arcane: Legend of Ark

Fabric 1.20.1 mod project.

## Build

GitHub Actions builds the project with Java 17 and Gradle 8.5. The workflow also checks that the Gradle, JSON and Java source files are real UTF-8 text files before compilation.

Required Minecraft/Fabric versions:
- Minecraft 1.20.1
- Fabric Loader 0.15.11+
- Fabric API 0.92.2+1.20.1
- Java 17

Project entrypoints:
- Server: `com.arcane.ArcaneMod`
- Client: `com.arcane.client.ArcaneClient`
